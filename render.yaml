services:
  - type: web
    name: growth-companion-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: glm
      - key: FALLBACK_LLM_PROVIDER
        value: deepseek
      - key: JWT_SECRET
        generateValue: true
      - key: OBSIDIAN_VAULT_DIR
        sync: false
      - key: OBSIDIAN_EXCLUDE
        value: API.md
      - key: OBSIDIAN_WRITE_BLOCK
        value: API.md
